<!DOCTYPE html>
<html lang="zh-cn">
<head>
	<title>我的订单</title>
	<link rel="stylesheet" type="text/css" href="/static/base.css">
	<link rel="stylesheet" type="text/css" href="/static/shop.css">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		.order-status-badge {
			padding: 0.2rem 0.6rem;
			border-radius: 12px;
			font-size: 0.75rem;
			font-weight: bold;
			display: inline-block;
		}
		.status-making {
			background: #FFF3E0;
			color: #E65100;
			border: 1px solid #FFB74D;
		}
		.status-tofetch {
			background: #E3F2FD;
			color: #01579B;
			border: 1px solid #64B5F6;
		}
		.status-fetched {
			background: #E8F5E9;
			color: #1B5E20;
			border: 1px solid #81C784;
		}
		.order-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 0.5rem;
			padding-bottom: 0.5rem;
			border-bottom: 1px solid #E0E0E0;
		}
		.order-content {
			margin: 0.8rem 0;
		}
		.order-item-detail {
			display: flex;
			justify-content: space-between;
			padding: 0.3rem 0;
			font-size: 0.9rem;
		}
		.order-total {
			text-align: right;
			margin-top: 0.5rem;
			padding-top: 0.5rem;
			border-top: 2px solid var(--border);
			font-size: 1.1rem;
			font-weight: bold;
			color: var(--accent);
		}
		.empty-state {
			text-align: center;
			padding: 3rem 1rem;
			color: #8F8F8F;
		}
		.empty-state-icon {
			font-size: 4rem;
			margin-bottom: 1rem;
		}
		.order-actions {
			margin-top: 0.5rem;
			display: flex;
			gap: 0.5rem;
			justify-content: flex-end;
		}
	</style>
</head>
<body>
	<div class="mobile_page">
		<div class="topBar">
			<div></div>
			<div class="title">
				{% if isShopper %}
				我的店铺订单
				{% else %}
				我的订单
				{% endif %}
			</div>
			<div></div>
		</div>
		<div id="orders_area" class="scrollview">
			<div class="empty-state" id="empty_state" style="display:none;">
				<div class="empty-state-icon">📦</div>
				<div>暂无订单记录</div>
			</div>
		</div>
		<div class="bottomBar">
			<button class="link_button" onclick="window.location.href='/shoplist'">返回店铺列表</button>
			{% if isShopper %}
			<button class="accent_button" onclick="window.location.href='/shop/{{shop_id}}'">返回店铺</button>
			{% endif %}
		</div>
	</div>
</body>

<script>
	var orders_area = document.getElementById("orders_area");
	var empty_state = document.getElementById("empty_state");
	
	function getStatusText(status) {
		if (status == 0) return "制作中";
		if (status == 1) return "待取餐";
		if (status == 2) return "已取餐";
		return "未知状态";
	}
	
	function getStatusClass(status) {
		if (status == 0) return "status-making";
		if (status == 1) return "status-tofetch";
		if (status == 2) return "status-fetched";
		return "";
	}
	
	function formatOrder(order) {
		const orderDiv = document.createElement("div");
		orderDiv.className = "order_item";
		
		const statusText = getStatusText(order.status);
		const statusClass = getStatusClass(order.status);
		
		let actionsHtml = "";
		{% if isShopper %}
		if (order.status == 0) {
			actionsHtml = `<button class="accent_button" onclick="makeOrderReady(${order.order_id})" style="font-size:0.85rem;">标记为待取餐</button>`;
		}
		{% endif %}
		
		let contentHtml = "";
		for (const item of order.content) {
			contentHtml += `
				<div class="order-item-detail">
					<span>${item.item_name} × ${item.num}</span>
				</div>
			`;
		}
		
		orderDiv.innerHTML = `
			<div class="order-header">
				<div style="font-weight:bold;">订单 #${order.order_id}</div>
				<span class="order-status-badge ${statusClass}">${statusText}</span>
			</div>
			<div class="order-content">
				${contentHtml}
			</div>
			<div class="order-total">
				总计：￥${order.total_amount.toFixed(2)}
			</div>
			${actionsHtml ? `<div class="order-actions">${actionsHtml}</div>` : ''}
		`;
		
		return orderDiv;
	}
	
	function updateOrders() {
		const url = {% if isShopper %}
			"/my_orders/getAllOrders_ofShop"
		{% else %}
			"/my_orders/getAllOrders_ofUser"
		{% endif %};
		
		const xhr = new XMLHttpRequest();
		xhr.open("GET", url, true);
		xhr.onreadystatechange = function() {
			if (xhr.readyState === XMLHttpRequest.DONE) {
				if (xhr.status == 200) {
					const orders = JSON.parse(xhr.responseText);
					orders_area.innerHTML = "";
					if (orders.length == 0) {
						empty_state.style.display = "block";
					} else {
						empty_state.style.display = "none";
						for (const order of orders) {
							orders_area.appendChild(formatOrder(order));
						}
					}
				} else {
					empty_state.style.display = "block";
					empty_state.innerHTML = '<div class="empty-state-icon">⚠️</div><div>加载订单失败</div>';
				}
			}
		};
		xhr.send();
	}
	
	{% if isShopper %}
	function makeOrderReady(order_id) {
		if (!confirm("确认将此订单标记为待取餐？")) {
			return;
		}
		const xhr = new XMLHttpRequest();
		xhr.open("GET", `/my_orders/makeit/${order_id}`, true);
		xhr.onreadystatechange = function() {
			if (xhr.readyState === XMLHttpRequest.DONE) {
				if (xhr.status == 200) {
					alert("操作成功");
					updateOrders();
				} else {
					alert("操作失败");
				}
			}
		};
		xhr.send();
	}
	{% endif %}
	
	updateOrders(); // 立即加载订单
	setInterval(updateOrders, 10000); // 每10秒刷新一次
</script>

</html>
